Wound, improve the Armour Penetration characteristic of that attack by 1.", "description_text": "Each time a NECRONS model from your army makes an attack, if that model is within range of an objective marker or the target of that attack is within range of an objective marker, on a Critical Wound, improve the Armour Penetration characteristic of that attack by 1."}, {"id": "000010667", "detachment_id": "000001128", "detachment": "Cursed Legion", "name": "Cold Fervour", "description_html": "<ul><li>Add 2 to the Strength characteristic of weapons equipped by Destroyer Cult models from your army.<\/li><li>The first time each turn that a <span class=\"kwb\">DESTROYER<\/span> <span class=\"kwb\">CULT<\/span> unit from your army makes attacks that destroy a unit or cause it to become Below Half-strength, after that unit has finished resolving its attacks, until the end of the turn, add 2 to the Strength characteristic of weapons equipped by friendly <span class=\"kwb\">NECRONS<\/span> models (excluding <span class=\"kwb\">DESTROYER<\/span> <span class=\"kwb\">CULT<\/span>, Monster and Titanic models).<\/li><\/ul>", "description_text": "Add 2 to the Strength characteristic of weapons equipped by Destroyer Cult models from your army.\nThe first time each turn that a DESTROYER CULT unit from your army makes attacks that destroy a unit or cause it to become Below Half-strength, after that unit has finished resolving its attacks, until the end of the turn, add 2 to the Strength characteristic of weapons equipped by friendly NECRONS models (excluding DESTROYER CULT, Monster and Titanic models)."}], "link": "https://wahapedia.ru/wh40k10ed/factions/necrons/Skorpekh-Destroyers"}, "000000523": {"id": "000000523", "name": "Overlord", "faction": {"id": "NEC", "name": "Necrons"}, "source": {"name": "Necrons", "type": "Faction Pack", "edition": "10", "version": "1.3", "errata_date": "04.03.2026 0:00:00"}, "role": "Characters", "legend": "Overlords lead the Necron dynasties in battle. Their android minds are tremendously swift, their bodies implacably resilient and their weapons eldritch, ancient and lethal. Yet it is the Overlords’ indomitable wills that are perhaps their most fearsome assets, for with these they drive entire armies to war.", "loadout": "<b>This model is equipped with:<\/b> tachyon arrow; Overlord’s blade.", "transport": null, "virtual": false, "models": [{"name": "Overlord", "M": "5\"", "T": "5", "Sv": "2+", "inv_sv": "4", "inv_sv_descr": null, "W": "6", "Ld": "6+", "OC": "1", "base_size": "40mm"}], "weapons": [{"name": "Staff of light", "type": "Ranged", "range": "18", "A": "3", "BS_WS": "2", "S": "5", "AP": "-2", "D": "1", "abilities": []}, {"name": "Tachyon arrow", "type": "Ranged", "range": "72", "A": "1", "BS_WS": "2", "S": "16", "AP": "-5", "D": "D6+2", "abilities": [{"keyword": "one shot", "value": null, "anti_target": null, "anti_threshold": null, "known": true, "raw": "one shot"}]}, {"name": "Overlord’s blade", "type": "Melee", "range": "Melee", "A": "4", "BS_WS": "2", "S": "8", "AP": "-3", "D": "2", "abilities": [{"keyword": "devastating wounds", "value": null, "anti_target": null, "anti_threshold": null, "known": true, "raw": "devastating wounds"}]}, {"name": "Staff of light", "type": "Melee", "range": "Melee", "A": "4", "BS_WS": "2", "S": "5", "AP": "-2", "D": "1", "abilities": []}, {"name": "Voidscythe", "type": "Melee", "range": "Melee", "A": "3", "BS_WS": "3", "S": "12", "AP": "-3", "D": "3", "abilities": [{"keyword": "devastating wounds", "value": null, "anti_target": null, "anti_threshold": null, "known": true, "raw": "devastating wounds"}]}], "abilities": {"faction": [{"name": "Reanimation Protocols", "model": null, "parameter": null, "description_html": "If your Army Faction is <span class=\"kwb\">NECRONS<\/span>, at the end of your Command phase, each unit from your army with this ability that is on the battlefield activates its Reanimation Protocols and reanimates D3 wounds. Each time such a unit reanimates a wound:<br><ul><li>If that unit contains one or more models with fewer than their starting number of wounds remaining, select one of those models; that model regains one lost wound<\/li><li>If all models in that unit have their starting number of wounds, but that unit is not at its Starting Strength, one destroyed model is returned to that unit with one wound remaining.<\/li><\/ul>Once such a unit is at its Starting Strength and all of its models have their starting number of wounds, nothing further happens.<br><br><div class=\"redExample\"><b>Example:<\/b> A unit of Lokhust Destroyers (which have a Wounds characteristic of 3) activates its Reanimation Protocols. The unit had a Starting Strength of 3, but currently contains 2 models, and one of those models has lost 1 wound. A 3 is rolled to see how many wounds are reanimated. The first of these reanimated wounds restores the wounded Lokhust Destroyer back to 3 wounds. The second of these reanimated wounds returns the destroyed Lokhust Destroyer to the battlefield with 1 wound remaining. The third of these reanimated wounds restores one of the remaining lost wounds to the same Lokhust Destroyer that was just returned. The unit now contains 3 models, two of which have 3 wounds remaining and one of which has 2 wounds remaining.<\/div>", "description_text": "If your Army Faction is NECRONS, at the end of your Command phase, each unit from your army with this ability that is on the battlefield activates its Reanimation Protocols and reanimates D3 wounds. Each time such a unit reanimates a wound:\nIf that unit contains one or more models with fewer than their starting number of wounds remaining, select one of those models; that model regains one lost wound\nIf all models in that unit have their starting number of wounds, but that unit is not at its Starting Strength, one destroyed model is returned to that unit with one wound remaining.\nOnce such a unit is at its Starting Strength and all of its models have their starting number of wounds, nothing further happens.\n\nExample: A unit of Lokhust Destroyers (which have a Wounds characteristic of 3) activates its Reanimation Protocols. The unit had a Starting Strength of 3, but currently contains 2 models, and one of those models has lost 1 wound. A 3 is rolled to see how many wounds are reanimated. The first of these reanimated wounds restores the wounded Lokhust Destroyer back to 3 wounds. The second of these reanimated wounds returns the destroyed Lokhust Destroyer to the battlefield with 1 wound remaining. The third of these reanimated wounds restores one of the remaining lost wounds to the same Lokhust Destroyer that was just returned. The unit now contains 3 models, two of which have 3 wounds remaining and one of which has 2 wounds remaining."}], "core": [{"name": "Leader", "model": null, "parameter": null, "description_html": "<div class=\"Corner33 abWrap BreakInsideAvoid\"><div class=\"abFlex\"><div class=\"abDiamondWrap\"><div class=\"abDiamond\"><div class=\"abIcon\"><\/div><\/div><\/div><div class=\"abLine\"><\/div><div class=\"abNameWrap\"><div class=\"abName\">LEADER<\/div><\/div><\/div><p style=\"padding-bottom:8px\" class=\"ShowFluff stratLegend2\">Mighty heroes fight at the forefront of battle.<\/p>Some <span class=\"kwb\">CHARACTER<\/span> units have ‘Leader’ listed on their datasheets. Such <span class=\"kwb\">CHARACTER<\/span> units are known as Leaders, and the units they can lead – known as their Bodyguard units – are listed on their datasheet.<br><br>During the Declare Battle Formations step, for each Leader in your army, if your army also includes one or more of that Leader’s Bodyguard units, you can select one of those Bodyguard units. That Leader will then attach to that Bodyguard unit for the duration of the battle and is said to be leading that unit. Each Bodyguard unit can only have one Leader attached to it.<br><br>While a Bodyguard unit contains a Leader, it is known as an Attached unit and, with the exception of rules that are triggered when units are <span class=\"tooltip00006\" data-tooltip-content=\"#tooltip_content00006\"><span class=\"tt kwbu\">destroyed<\/span><\/span>, it is treated as a single unit for all rules purposes. Each time an attack targets an Attached unit, until the attacking unit has resolved all of its attacks, you must use the Toughness characteristic of the Bodyguard models in that unit, even if a Leader in that unit has a different Toughness characteristic. Each time an attack sucessfully wounds an Attached unit, that attack cannot be allocated to a <span class=\"kwb\">CHARACTER<\/span> model in that unit, even if that <span class=\"kwb\">CHARACTER<\/span> model has lost one or more wounds or has already had attacks allocated to it this phase. As soon as the last Bodyguard model in an Attached unit has been destroyed, any attacks made against that unit that have yet to be allocated can then be allocated to <span class=\"kwb\">CHARACTER<\/span> models in that unit.<br><br>Each time the last model in a Bodyguard unit is destroyed, each <span class=\"kwb\">CHARACTER<\/span> unit that is part of that Attached unit is no longer part of an Attached unit. It becomes a separate unit, with its original Starting Strength. If this happens as the result of an attack, they become separate units after the attacking unit has resolved all of its attacks.<br><br>Each time the last model in a <span class=\"kwb\">CHARACTER<\/span> unit that is attached to a Bodyguard unit is destroyed and there is not another <span class=\"kwb\">CHARACTER<\/span> unit attached, that Attached unit’s Bodyguard unit is no longer part of an Attached unit. It becomes a separate unit, with its original Starting Strength. If this happens as the result of an attack, they become separate units after the attacking unit has resolved all of its attacks. <br><br>Each time a unit that is part of an Attached unit is destroyed, it does not have the keywords of any other units that make up that Attached unit (unless it has those keywords on its own datasheet) for the purposes of any rules that would be triggered when that unit is destroyed.<br><br><div class=\"redExample\"><b>Example:<\/b> <i>If you only destroy the Bodyguard unit that is part of an Attached unit, you have not destroyed a <span class=\"kwb\">CHARACTER<\/span> unit. If you only destroy the <span class=\"kwb\">CHARACTER<\/span> unit that is part of an Attached unit, or if you destroy the whole Attached unit, you have destroyed one <span class=\"kwb\">CHARACTER<\/span> unit.<\/i><\/div><br><div class=\"BreakInsideAvoid frameLight Corner14\" style=\"\"><ul class=\"redSquare\"><li>Before the battle, <span class=\"kwb\">CHARACTER<\/span> units with the Leader ability can be attached to one of their Bodyguard units to form an Attached unit.<\/li><li>Attached units can only contain one Leader.<\/li><li>Attacks cannot be allocated to <span class=\"kwb\">CHARACTER<\/span> models in Attached units.<\/li><\/ul><\/div><\/div>", "description_text": "LEADER\n\nMighty heroes fight at the forefront of battle.\nSome CHARACTER units have ‘Leader’ listed on their datasheets. Such CHARACTER units are known as Leaders, and the units they can lead – known as their Bodyguard units – are listed on their datasheet.\n\nDuring the Declare Battle Formations step, for each Leader in your army, if your army also includes one or more of that Leader’s Bodyguard units, you can select one of those Bodyguard units. That Leader will then attach to that Bodyguard unit for the duration of the battle and is said to be leading that unit. Each Bodyguard unit can only have one Leader attached to it.\n\nWhile a Bodyguard unit contains a Leader, it is known as an Attached unit and, with the exception of rules that are triggered when units are destroyed, it is treated as a single unit for all rules purposes. Each time an attack targets an Attached unit, until the attacking unit has resolved all of its attacks, you must use the Toughness characteristic of the Bodyguard models in that unit, even if a Leader in that unit has a different Toughness characteristic. Each time an attack sucessfully wounds an Attached unit, that attack cannot be allocated to a CHARACTER model in that unit, even if that CHARACTER model has lost one or more wounds or has already had attacks allocated to it this phase. As soon as the last Bodyguard model in an Attached unit has been destroyed, any attacks made against that unit that have yet to be allocated can then be allocated to CHARACTER models in that unit.\n\nEach time the last model in a Bodyguard unit is destroyed, each CHARACTER unit that is part of that Attached unit is no longer part of an Attached unit. It becomes a separate unit, with its original Starting Strength. If this happens as the result of an attack, they become separate units after the attacking unit has resolved all of its attacks.\n\nEach time the last model in a CHARACTER unit that is attached to a Bodyguard unit is destroyed and there is not another CHARACTER unit attached, that Attached unit’s Bodyguard unit is no longer part of an Attached unit. It becomes a separate unit, with its original Starting Strength. If this happens as the result of an attack, they become separate units after the attacking unit has resolved all of its attacks.\n\nEach time a unit that is part of an Attached unit is destroyed, it does not have the keywords of any other units that make up that Attached unit (unless it has those keywords on its own datasheet) for the purposes of any rules that would be triggered when that unit is destroyed.\n\nExample: If you only destroy the Bodyguard unit that is part of an Attached unit, you have not destroyed a CHARACTER unit. If you only destroy the CHARACTER unit that is part of an Attached unit, or if you destroy the whole Attached unit, you have destroyed one CHARACTER unit.\n\nBefore the battle, CHARACTER units with the Leader ability can be attached to one of their Bodyguard units to form an Attached unit.\nAttached units can only contain one Leader.\nAttacks cannot be allocated to CHARACTER models in Attached units."}], "datasheet": [{"name": "Resurrection Orb", "model": null, "parameter": null, "description_html": "Once per battle, while the bearer is leading a unit, at the end of any phase, it can resurrect that unit if it is on the battlefield. When you do, that unit’s Reanimation Protocols are activated, reanimating D6 wounds rather than D3 when doing so. You cannot resurrect more than one unit per turn.", "description_text": "Once per battle, while the bearer is leading a unit, at the end of any phase, it can resurrect that unit if it is on the battlefield. When you do, that unit’s Reanimation Protocols are activated, reanimating D6 wounds rather than D3 when doing so. You cannot resurrect more than one unit per turn."}, {"name": "My Will Be Done", "model": null, "parameter": null, "description_html": "Once per battle round, one unit from your army with this ability can use it when its unit is targeted with a Stratagem. If it does, reduce the CP cost of that use of that Stratagem by 1CP.", "description_text": "Once per battle round, one unit from your army with this ability can use it when its unit is targeted with a Stratagem. If it does, reduce the CP cost of that use of that Stratagem by 1CP."}, {"name": "Implacable Resilience", "model": null, "parameter": null, "description_html": "Each time an attack is allocated to this model, subtract 1 from that attack’s Damage characteristic.", "description_text": "Each time an attack is allocated to this model, subtract 1 from that attack’s Damage characteristic."}, {"name": "One Shot", "model": null, "parameter": null, "description_html": "The bearer can only shoot with this weapon once per battle.", "description_text": "The bearer can only shoot with this weapon once per battle."}]}, "keywords": ["Overlord", "Noble", "Character", "Infantry"], "faction_keywords": ["Necrons"], "unit_compos : "1", "abilities": [{"keyword": "sustained hits", "value": "2", "anti_target": null, "anti_threshold": null, "known": true, "raw": "sustained hits 2"}]}, {"name": "Twin tesla destructor", "type": "Ranged", "range": "36", "A": "6", "BS_WS": "3", "S": "8", "AP": "0", "D": "2", "abilities": [{"keyword": "sustained hits", "value": "2", "anti_target": null, "anti_threshold": null, "known": true, "raw": "sustained hits 2"}, {"keyword": "twin-linked", "value": null, "anti_target": null, "anti_threshold": null, "known": true, "raw": "twin-linked"}]}, {"name": "Armoured bulk", "type": "Melee", "range": "Melee", "A": "3", "BS_WS": "4", "S": "6", "AP": "0", "D": "1", "abilities": []}], "abilities": {"faction": [{"name": "Reanimation Protocols", "model": null, "parameter": null, "description_html": "If your Army Faction is <span class=\"kwb\">NECRONS<\/span>, at the end of your Command phase, each unit from your army with this ability that is on the battlefield activates its Reanimation Protocols and reanimates D3 wounds. Each time such a unit reanimates a wound:<br><ul><li>If that unit contains one or more models with fewer than their starting number of wounds remaining, select one of those models; that model regains one lost wound<\/li><li>If all models in that unit have their starting number of wounds, but that unit is not at its Starting Strength, one destroyed model is returned to that unit with one wound remaining.<\/li><\/ul>Once such a unit is at its Starting Strength and all of its models have their starting number of wounds, nothing further happens.<br><br><div class=\"redExample\"><b>Example:<\/b> A unit of Lokhust Destroyers (which have a Wounds characteristic of 3) activates its Reanimation Protocols. The unit had a Starting Strength of 3, but currently contains 2 models, and one of those models has lost 1 wound. A 3 is rolled to see how many wounds are reanimated. The first of these reanimated wounds restores the wounded Lokhust Destroyer back to 3 wounds. The second of these reanimated wounds returns the destroyed Lokhust Destroyer to the battlefield with 1 wound remaining. The third of these reanimated wounds restores one of the remaining lost wounds to the same Lokhust Destroyer that was just returned. The unit now contains 3 models, two of which have 3 wounds remaining and one of which has 2 wounds remaining.<\/div>", "description_text": "If your Army Faction is NECRONS, at the end of your Command phase, each unit from your army with this ability that is on the battlefield activates its Reanimation Protocols and reanimates D3 wounds. Each time such a unit reanimates a wound:\nIf that unit contains one or more models with fewer than their starting number of wounds remaining, select one of those models; that model regains one lost wound\nIf all models in that unit have their starting number of wounds, but that unit is not at its Starting Strength, one destroyed model is returned to that unit with one wound remaining.\nOnce such a unit is at its Starting Strength and all of its models have their starting number of wounds, nothing further happens.\n\nExample: A unit of Lokhust Destroyers (which have a Wounds characteristic of 3) activates its Reanimation Protocols. The unit had a Starting Strength of 3, but currently contains 2 models, and one of those models has lost 1 wound. A 3 is rolled to see how many wounds are reanimated. The first of these reanimated wounds restores the wounded Lokhust Destroyer back to 3 wounds. The second of these reanimated wounds returns the destroyed Lokhust Destroyer to the battlefield with 1 wound remaining. The third of these reanimated wounds restores one of the remaining lost wounds to the same Lokhust Destroyer that was just returned. The unit now contains 3 models, two of which have 3 wounds remaining and one of which has 2 wounds remaining."}], "core": [{"name": "Deadly Demise", "model": null, "parameter": "1", "description_html": "<div class=\"Corner33 abWrap BreakInsideAvoid\"><div class=\"abFlex\"><div class=\"abDiamondWrap\"><div class=\"abDiamond\"><div class=\"abIcon\"><\/div><\/div><\/div><div class=\"abLine\"><\/div><div class=\"abNameWrap\"><div class=\"abName\">DEADLY DEMISE<\/div><\/div><\/div><p style=\"padding-bottom:8px\" class=\"ShowFluff stratLegend2\">From detonating ammo stores to corrosive innards or frenzied death throes, some targets are deadly even in defeat.<\/p>Some models have ‘Deadly Demise x’ listed in their abilities. When such a model is <span class=\"tooltip00006\" data-tooltip-content=\"#tooltip_content00006\"><span class=\"tt kwbu\">destroyed<\/span><\/span>, roll one D6 before removing it from play (if such a model is a <a href=\"/wh40k10ed/the-rules/core-rules/#Transports\"><span class=\"kwb\">TRANSPORT<\/span><\/a>, roll before any embarked models <span class=\"tooltip00029\" data-tooltip-content=\"#tooltip_content00029\"><span class=\"tt kwbu\">disembark<\/span><\/span>). On a 6, each unit within 6\" of that model suffers a number of <span class=\"tooltip00028\" data-tooltip-content=\"#tooltip_content00028\"><span class=\"tt kwbu\">mortal<\/span> <span class=\"tt kwbu\">wounds<\/span><\/span> denoted by ‘x’ (if this is a random number, roll separately for each unit within 6\").<br><br><div class=\"redExample\"><b>Example:<\/b> A <span class=\"kwb\">TRANSPORT<\/span> model with the Deadly Demise D3 ability is destroyed. Before any models disembark and before removing it from play, its controlling player rolls one D6, getting a 6. There are three units within 6\" of that destroyed model, so its controlling player rolls one D3 for each of them, inflicting mortal wounds accordingly.<\/div><br><div class=\"BreakInsideAvoid frameLight Corner14\" style=\"\"><ul class=\"redSquare\"><li><b>Deadly Demise x:<\/b> When this model is destroyed, roll one D6. On a 6, each unit within 6\" suffers ‘x’ mortal wounds.<\/li><\/ul><\/div><\/div>", "description_text": "DEADLY DEMISE\n\nFrom detonating ammo stores to corrosive innards or frenzied death throes, some targets are deadly even in defeat.\nSome models have ‘Deadly Demise x’ listed in their abilities. When such a model is destroyed, roll one D6 before removing it from play (if such a model is a TRANSPORT, roll before any embarked models disembark). On a 6, each unit within 6\" of that model suffers a number of mortal wounds denoted by ‘x’ (if this is a random number, roll separately for each unit within 6\").\n\nExample: A TRANSPORT model with the Deadly Demise D3 ability is destroyed. Before any models disembark and before removing it from play, its controlling player rolls one D6, getting a 6. There are three units within 6\" of that destroyed model, so its controlling player rolls one D3 for each of them, inflicting mortal wounds accordingly.\n\nDeadly Demise x: When this model is destroyed, roll one D6. On a 6, each unit within 6\" suffers ‘x’ mortal wounds."}], "datasheet": [{"name": "Malevolent Arcing", "model": null, "parameter": null, "description_html": "In your Shooting phase, each time you select a target for this model’s twin tesla destructor, roll one D6 for the target unit and one D6 for every other enemy unit within 3\" of the target unit. On a 5+, the unit being rolled for is struck by arcing energies; after resolving all of this model’s attacks against the target unit, each unit struck by arcing energies suffers D3 mortal wounds.", "description_text": "In your Shooting phase, each time you select a target for this model’s twin tesla destructor, roll one D6 for the target unit and one D6 for every other enemy unit within 3\" of the target unit. On a 5+, the unit being rolled for is struck by arcing energies; after resolving all of this model’s attacks against the target unit, each unit struck by arcing energies suffers D3 mortal wounds."}]}, "keywords": ["Vehicle", "Annihilation Barge", "Fly"], "faction_keywords": ["Necrons"], "unit_composition": [{"line": "1", "description": "1 Annihilation Barge"}], "wargear_options": old": null, "known": true, "raw": "devastating wounds"}]}, {"name": "Scythe of the Nightbringer – sweep", "type": "Melee", "range": "Melee", "A": "14", "BS_WS": "2", "S": "8", "AP": "-2", "D": "2", "abilities": []}], "abilities": {"faction": [{"name": "Reanimation Protocols", "model": null, "parameter": null, "description_html": "If your Army Faction is <span class=\"kwb\">NECRONS<\/span>, at the end of your Command phase, each unit from your army with this ability that is on the battlefield activates its Reanimation Protocols and reanimates D3 wounds. Each time such a unit reanimates a wound:<br><ul><li>If that unit contains one or more models with fewer than their starting number of wounds remaining, select one of those models; that model regains one lost wound<\/li><li>If all models in that unit have their starting number of wounds, but that unit is not at its Starting Strength, one destroyed model is returned to that unit with one wound remaining.<\/li><\/ul>Once such a unit is at its Starting Strength and all of its models have their starting number of wounds, nothing further happens.<br><br><div class=\"redExample\"><b>Example:<\/b> A unit of Lokhust Destroyers (which have a Wounds characteristic of 3) activates its Reanimation Protocols. The unit had a Starting Strength of 3, but currently contains 2 models, and one of those models has lost 1 wound. A 3 is rolled to see how many wounds are reanimated. The first of these reanimated wounds restores the wounded Lokhust Destroyer back to 3 wounds. The second of these reanimated wounds returns the destroyed Lokhust Destroyer to the battlefield with 1 wound remaining. The third of these reanimated wounds restores one of the remaining lost wounds to the same Lokhust Destroyer that was just returned. The unit now contains 3 models, two of which have 3 wounds remaining and one of which has 2 wounds remaining.<\/div>", "description_text": "If your Army Faction is NECRONS, at the end of your Command phase, each unit from your army with this ability that is on the battlefield activates its Reanimation Protocols and reanimates D3 wounds. Each time such a unit reanimates a wound:\nIf that unit contains one or more models with fewer than their starting number of wounds remaining, select one of those models; that model regains one lost wound\nIf all models in that unit have their starting number of wounds, but that unit is not at its Starting Strength, one destroyed model is returned to that unit with one wound remaining.\nOnce such a unit is at its Starting Strength and all of its models have their starting number of wounds, nothing further happens.\n\nExample: A unit of Lokhust Destroyers (which have a Wounds characteristic of 3) activates its Reanimation Protocols. The unit had a Starting Strength of 3, but currently contains 2 models, and one of those models has lost 1 wound. A 3 is rolled to see how many wounds are reanimated. The first of these reanimated wounds restores the wounded Lokhust Destroyer back to 3 wounds. The second of these reanimated wounds returns the destroyed Lokhust Destroyer to the battlefield with 1 wound remaining. The third of these reanimated wounds restores one of the remaining lost wounds to the same Lokhust Destroyer that was just returned. The unit now contains 3 models, two of which have 3 wounds remaining and one of which has 2 wounds remaining."}], "core": [{"name": "Deadly Demise", "model": null, "parameter": "D6", "description_html": "<div class=\"Corner33 abWrap BreakInsideAvoid\"><div class=\"abFlex\"><div class=\"abDiamondWrap\"><div class=\"abDiamond\"><div class=\"abIcon\"><\/div><\/div><\/div><div class=\"abLine\"><\/div><div class=\"abNameWrap\"><div class=\"abName\">DEADLY DEMISE<\/div><\/div><\/div><p style=\"padding-bottom:8px\" class=\"ShowFluff stratLegend2\">From detonating ammo stores to corrosive innards or frenzied death throes, some targets are deadly even in defeat.<\/p>Some models have ‘Deadly Demise x’ listed in their abilities. When such a model is <span class=\"tooltip00006\" data-tooltip-content=\"#tooltip_content00006\"><span class=\"tt kwbu\">destroyed<\/span><\/span>, roll one D6 before removing it from play (if such a model is a <a href=\"/wh40k10ed/the-rules/core-rules/#Transports\"><span class=\"kwb\">TRANSPORT<\/span><\/a>, roll before any embarked models <span class=\"tooltip00029\" data-tooltip-content=\"#tooltip_content00029\"><span class=\"tt kwbu\">disembark<\/span><\/span>). On a 6, each unit within 6\" of that model suffers a number of <span class=\"tooltip00028\" data-tooltip-content=\"#tooltip_content00028\"><span class=\"tt kwbu\">mortal<\/span> <span class=\"tt kwbu\">wounds<\/span><\/span> denoted by ‘x’ (if this is a random number, roll separately for each unit within 6\").<br><br><div class=\"redExample\"><b>Example:<\/b> A <span class=\"kwb\">TRANSPORT<\/span> model with the Deadly Demise D3 ability is destroyed. Before any models disembark and before removing it from play, its controlling player rolls one D6, getting a 6. There are three units within 6\" of that destroyed model, so its controlling player rolls one D3 for each of them, inflicting mortal wounds accordingly.<\/div><br><div class=\"BreakInsideAvoid frameLight Corner14\" style=\"\"><ul class=\"redSquare\"><li><b>Deadly Demise x:<\/b> When this model is destroyed, roll one D6. On a 6, each unit within 6\" suffers ‘x’ mortal wounds.<\/li><\/ul><\/div><\/div>", "description_text": "DEADLY DEMISE\n\nFrom detonating ammo stores to corrosive innards or frenzied death throes, some targets are deadly even in defeat.\nSome models have ‘Deadly Demise x’ listed in their abilities. When such a model is destroyed, roll one D6 before removing it from play (if such a model is a TRANSPORT, roll before any embarked models disembark). On a 6, each unit within 6\" of that model suffers a number of mortal wounds denoted by ‘x’ (if this is a random number, roll separately for each unit within 6\").\n\nExample: A TRANSPORT model with the Deadly Demise D3 ability is destroyed. Before any models disembark and before removing it from play, its controlling player rolls one D6, getting a 6. There are three units within 6\" of that destroyed model, so its controlling player rolls one D3 for each of them, inflicting mortal wounds accordingly.\n\nDeadly Demise x: When this model is destroyed, roll one D6. On a 6, each unit within 6\" suffers ‘x’ mortal wounds."}, {"name": "Deep Strike", "model": null, "parameter": null, "description_html": "<div class=\"Corner33 abWrap BreakInsideAvoid\"><div class=\"abFlex\"><div class=\"abDiamondWrap\"><div class=\"abDiamond\"><div class=\"abIcon\"><\/div><\/div><\/div><div class=\"abLine\"><\/div><div class=\"abNameWrap\"><div class=\"abName\">DEEP STRIKE<\/div><\/div><\/div><p style=\"padding-bottom:8px\" class=\"ShowFluff stratLegend2\">Some units make their way to battle via tunnelling, teleportation, high-altitude descent or other extraordinary means that allow them to appear suddenly in the thick of the fighting.<\/p>During the Declare Battle Formations step, if every model in a unit has this ability, you can set it up in Reserves instead of setting it up on the battlefield. If you do, in the Reinforcements step of one of your Movement phases you can set up this unit anywhere on the battlefield that is more than 9\" horizontally away from all enemy models. If a unit with the Deep Strike ability arrives from Strategic Reserves, the controlling player can choose for that unit to be set up either using the rules for Strategic Reserves or using the Deep Strike ability. <br><div class=\"BreakInsideAvoid frameLight Corner14\" style=\"\"><ul class=\"redSquare\"><li>Unit can be set up in Reserves instead of on the battlefield.<\/li><li>Unit can be set up in your Reinforcements step, more than 9\" horizontally away from all enemy models.<\/li><\/ul><\/div><\/div>", "description_text": "DEEP STRIKE\n\nSome units make their way to battle via tunnelling, teleportation, high-altitude descent or other extraordinary means that allow them to appear suddenly in the thick of the fighting.\nDuring the Declare Battle Formations step, if every model in a unit has this ability, you can set it up in Reserves instead of setting it up on the battlefield. If you do, in the Reinforcements step of one of your Movement phases you can set up this unit anywhere on the battlefield that is more than 9\" horizontally away from all enemy models. If a unit with the Deep Strike ability arrives from Strategic Reserves, the controlling player can choose for that unit to be set up either using the rules for Strategic Reserves or using the Deep Strike ability.\nUnit can be set up in Reserves instead of on the battlefield.\nUnit can be set up in your Reinforcements step, more than 9\" horizontally away from all enemy models."}, {"name": "Feel No Pain", "model": null, "parameter": "5+", "description_html": "<div class=\"Corner33 abWrap BreakInsideAvoid\"><div class=\"abFlex\"><div class=\"abDiamondWrap\"><div class=\"abDiamond\"><div class=\"abIcon\"><\/div><\/div><\/div><div class=\"abLine\"><\/div><div class=\"abNameWrap\"><div class=\"abName\">FEEL NO PAIN<\/div><\/div><\/div><p style=\"padding-bottom:8px\" class=\"ShowFluff stratLegend2\">Some warriors refuse to be laid low, even by what should be fatal wounds.<\/p>Some models have ‘Feel No Pain x+’ listed in their abilities. Each time a model with this ability suffers damage and so would lose a wound (including wounds lost due to <span class=\"tooltip00028\" data-tooltip-content=\"#tooltip_content00028\"><span class=\"tt kwbu\">mortal<\/span> <span class=\"tt kwbu\">wounds<\/span><\/span>), roll one D6: if the result is greater than or equal to the number denoted by ‘x’, that wound is ignored and is not lost. If a model has more than one Feel No Pain ability, you can only use one of those abilities each time that model suffers damage and so would lose a wound.<br><br><div class=\"BreakInsideAvoid frameLight Corner14\" style=\"\"><ul class=\"redSquare\"><li><b>Feel No Pain x+:<\/b> Each time this model would lose a wound, roll one D6: if the result equals or exceeds ‘x’, that wound is not lost.<\/li><\/ul><\/div><\/div>", "description_text": "FEEL NO PAIN\n\nSome warriors refuse to be laid low, even by what should be fatal wounds.\nSome models have ‘Feel No Pain x+’ listed in their abilities. Each time a model with this ability suffers damage and so would lose a wound (including wounds lost due to mortal wounds), roll one D6: if the result is greater than or equal to the number denoted by ‘x’, that wound is ignored and is not lost. If a model has more than one Feel No Pain ability, you can only use one of those abilities each time that model suffers damage and so would lose a wound.\n\nFeel No Pain x+: Each time this model would lose a wound, roll one D6: if the result equals or exceeds ‘x’, that wound is not lost."}], "datasheet": [{"name": "Drain Life", "model": null, "parameter": null, "description_html": "At the end of the Fight phase, roll one D6 for each enemy unit within 6\" of this model: on a 4+, that enemy unit suffers D3 mortal wounds.", "description_text": "At the end of the Fight phase, roll one D6 for each enemy unit within 6\" of this model: on a 4+, that enemy unit suffers D3 mortal wounds."}, {"name": "Necrodermis", "model": null, "parameter": null, "description_html": "Each time an attack is allocated to this model, subtract 1 from the Damage characteristic of that attack.", "description_text": "Each time an attack is allocated to this model, subtract 1 from the Damage characteristic of that attack."}, {"name": "ENSLAVED STAR GOD", "model": null, "parameter": null, "description_html": "This model cannot be your <span class=\"kwb\">WARLORD<\/span>.", "description_text": "This model cannot be your WARLORD."}]}, "keywords": ["Character", "Epic Hero", "Fly", "C’tan Shard of the Nightbringer", "Monster"], "faction_keywords": ["Necrons"], "unit_com at attack by 1.\n\nAt the start of each phase, for each NECRONS MONSTER unit from your army, that unit can suffer 3 mortal wounds. If it does, until the end of the phase, the range of that unit’s Distortion Fields Aura ability is increased to 9\".\n\nDesigner’s Note: If your army contains more than one Transcendent C’tan unit, each of those units must take the Reletavistic Tether ability.\n\nRESTRICTIONS\nWhen mustering your army, each NECRONS MONSTER unit from your army has the relevant Necrodermal Binding ability shown below, and you must increase the points cost of each of those units by the amount shown in the Munitorum Field Manual. If this causes your army to exceed the points limit for the battle you are playing, you cannot include that unit in your army."}, {"id": "000008553", "detachment_id": "000000818", "detachment": "Hypercrypt Legion", "name": "Hyperphasing", "description_html": "At the end of your opponent’s turn, you can select a number of <span class=\"kwb\">NECRONS<\/span> units from your army (excluding units that are within Engagement Range of one or more enemy units). The maximum number of units you can select depends on the battle size, as follows:<br><br><div class=\"BreakInsideAvoid\"  style=\"\"\"><table width=\"0\" border=\"0\" bordercolor=\"#888\" cellpadding=\"4\" cellspacing=\"0\" style=\"border-collapse:collapse;border-width:0px\"><tbody><tr><td><table class=\" customTable tablefont\" border=\"1\" bordercolor=\"#888\" cellpadding=\"4\" style=\"border-collapse:collapse;border-color:#888888;border-width:0px\"><tbody><tr><td style=\"border-width:1px 1px 1px 1px;border-style:none none solid none;background-color:rgb(4,83,42);color:rgb(254,254,254);text-align:center;vertical-align:middle;font-size:20px;width:160px;height:0px;\"><b>BATTLE SIZE<\/b><\/td><td style=\"border-width:1px 1px 1px 1px;border-style:none none solid none;background-color:rgb(4,83,42);color:rgb(254,254,254);text-align:center;vertical-align:middle;font-size:20px;width:320p his is not cumulative with any other modifiers that improve Armour Penetration].", "description_text": "WHEN: Fight phase.\n\nTARGET: One NECRONS unit from your army that has not been selected to fight this phase.\n\nEFFECT: Until the end of the phase, add 1 to the Strength characteristic of melee weapons equipped by models in your unit. In addition, If a Necrons Character is leading your unit, until the end of the phase, improve the Armour Penetration characteristic of melee weapons equipped by models in your unit by 1. (this is not cumulative with any other modifiers that improve Armour Penetration]."}, {"id": "000008371006", "name": "PROTOCOL OF THE CONQUERING TYRANT", "cp_cost": "1", "type": "Awakened Dynasty – Battle Tactic Stratagem", "turn": "Your turn", "phase": "Shooting phase", "legend": "The legions employ the strategies of their masters in perfect synchronicity, laying down hails of mechanically coordinated fire.", "description_html": "<b>WHEN:<\/b> Your Shooting phase.<br><br><b>TARGET:<\/b> One <span class=\"kwb\">NECRONS<\/span> unit from your army that has not been selected to shoot this phase.<br><br><b>EFFECT:<\/b> Until the end of the phase, each time a model in your unit makes an attack that targets a unit within half range, re-roll a Hit roll of 1. If a NECRONS CHARACTER is leading your unit, until the end of the phase, you can re-roll the Hit roll for that attack instead.", "description_text": "WHEN: Your Shooting phase.\n\nTARGET: One NECRONS unit from your army that has not been selected to shoot this phase.\n\nEFFECT: Until the end of the phase, each time a model in your unit makes an attack that targets a unit within half range, re-roll a Hit roll of 1. If a NECRONS CHARACTER is leading your unit, until the end of the phase, you can re-roll the Hit roll for that attack instead."}, {"id": "000008371002", "name": "PROTOCOL OF THE ETERNAL REVENANT", "cp_cost": "1", "type": "Awakened Dynasty – Epic Deed Stratagem", "turn": "Either player’s turn", "phase": "Any phase", "legend": "Necron rulers possess enhanced self-repair systems.", "description_html": "<b>WHEN:<\/b> Any phase.<br><br><b>TARGET:<\/b> One Necrons Infantry Character model from your army that was just destroyed. You can use this Stratagem on that model even though it was just destroyed.<br><br><b>EFFECT:<\/b> At the end of the phase, set your model back up on the battlefield as close as possible to where it was destroyed and not within Engagement Range of any enemy units, with half of its starting number of wounds remaining.<br><br><b>RESTRICTIONS:<\/b> Each model can only be targeted with this Stratagem once per battle.", "description_text": "WHEN: Any phase.\n\nTARGET: One Necrons Infantry Character model from your army that was just destroyed. You can use this Stratagem on that model even though it was just destroyed.\n\nEFFECT: At the end of the phase, set your model back up on the battlefield as close as possible to where it was destroyed and not within Engagement Range of any enemy units, with half of its starting number of wounds remaining.\n\nRESTRICTIONS: Each model can only be targeted with this Stratagem once per battle."}, {"id": "000008371003", "name": "PROTOCOL OF THE UNDYING LEGIONS", "cp_cost": "1", "type": "Awakened Dynasty – Strategic Ploy Stratagem", "turn": "Either player’s turn", "phase": "Shooting or Fight phase", "legend": "Nanoscarabs are released in boiling black clouds that whirl about the legions and effect rapid repairs", "description_html": "<b>WHEN:<\/b> Your opponent’s Shooting phase or the Fight phase, just after an enemy unit has resolved its attacks.<br><br><b>TARGET:<\/b> One <span class=\"kwb\">NECRONS<\/span> unit from your army that had one or more of its models destroyed as a result of the attacking unit’s attacks.<br><br><b>EFFECT:<\/b> Your unit activates its Reanimation Protocols and reanimates D3 wounds (or D3+1 wounds if a NECRONS CHARACTER is leading your unit].", "description_text": "WHEN: Your op <script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

// ---- Données : essaie le vrai dossier ./output, sinon échantillon embarqué ----
const SAMPLE = JSON.parse(document.getElementById('sampleData').textContent);

async function loadIndex(){
  try{
    const r = await fetch('./output/index.json', {cache:'no-store'});
    if(!r.ok) throw 0;
    const idx = await r.json();
    return { idx, demo:false };
  }catch(e){
    return { idx: SAMPLE.index, demo:true };
  }
}
async function loadDatasheet(id, demo){
  if(!demo){
    try{ const r = await fetch(`./output/datasheets/${id}.json`,{cache:'no-store'}); if(r.ok) return await r.json(); }catch(e){}
  }
  return SAMPLE.records[id] || null;
}
async function loadDetachment(id, demo){
  if(!demo){
    try{ const r = await fetch(`./output/detachments/${id}.json`,{cache:'no-store'}); if(r.ok) return await r.json(); }catch(e){}
  }
  return SAMPLE.detachments[id] || null;
}

// ---- Helpers d'affichage ----
const titleCase = s => (s||'').replace(/\b([a-z])/g, m=>m.toUpperCase());
function abilityLabel(a){
  if(a.keyword==='anti') return `Anti-${titleCase(a.anti_target)} ${a.anti_threshold}`;
  let base = titleCase(a.raw);
  return base;
}
function Chip({children, unknown}){
  return <span className={"chip chip-"+(unknown?'unknown':'known')+" mono text-[11px] leading-none px-1.5 py-1 rounded muted"} style={{color: unknown? 'var(--brass)':'var(--ink)'}}>{children}</span>;
}
function Html({html, className}){
  return <div className={"rules "+(className||'')} dangerouslySetInnerHTML={{__html: html||''}} />;
}

// ---- Ligne de stats (signature) ----
function StatLine({m}){
  const cells = [['M',m.M],['T',m.T],['SV',m.Sv],['W',m.W],['LD',m.Ld],['OC',m.OC]];
  return (
    <div>
      {m.name ? <div className="disp text-[13px] uppercase tracking-wide muted mb-1">{m.name}</div> : null}
      <div className="grid grid-cols-6 gap-1.5">
        {cells.map(([k,v])=>(
          <div key={k} className="statbox px-1 py-1.5 text-center">
            <div className="disp text-[10px] muted leading-none mb-1">{k}</div>
            <div className="mono text-[15px] leading-none ink">{v||'–'}</div>
          </div>
        ))}
      </div>
      {m.inv_sv && m.inv_sv!=='-' ? (
        <div className="mt-1.5 flex items-center gap-2 text-[12px]">
          <span className="statbox px-2 py-1 mono ink">{m.inv_sv}</span>
          <span className="muted">save invulnerable{m.inv_sv_descr? ' — '+m.inv_sv_descr:''}</span>
        </div>
      ):null}
    </div>
  );
}

// ---- Bloc d'arme (compact mobile) ----
function Weapon({w}){
  const ranged = (w.type||'').toLowerCase()!=='melee';
  const stats = ranged
    ? [['R',w.range],['A',w.A],['BS',w.BS_WS],['S',w.S],['AP',w.AP],['D',w.D]]
    : [['A',w.A],['WS',w.BS_WS],['S',w.S],['AP',w.AP],['D',w.D]];
  return (
    <div className="py-2 border-b hairline last:border-0">
      <div className="flex items-center gap-2">
        <span className="mono text-[10px] px-1 py-0.5 rounded" style={{color: ranged?'var(--steel)':'var(--brass)', border:'1px solid var(--line)'}}>{ranged?'TIR':'CC'}</span>
        <span className="disp text-[16px] leading-tight ink flex-1">{w.name}</span>
      </div>
      <div className="mt-1.5 flex flex-wrap gap-x-3 gap-y-1">
        {stats.map(([k,v])=>(
          <span key={k} className="mono text-[12px]"><span className="faint">{k} </span><span className="ink">{v||'–'}</span></span>
        ))}
      </div>
      {w.abilities && w.abilities.length ? (
        <div className="mt-1.5 flex flex-wrap gap-1">
          {w.abilities.map((a,i)=><Chip key={i} unknown={!a.known}>{abilityLabel(a)}</Chip>)}
        </div>
      ):null}
    </div>
  );
}

function SectionTitle({children, kicker}){
  return (
    <div className="mt-5 mb-2">
      {kicker? <div className="disp text-[11px] uppercase tracking-[.18em] faint">{kicker}</div>:null}
      <div className="disp text-[19px] uppercase tracking-wide" style={{color:'var(--ink)'}}>{children}</div>
      <div className="h-px mt-1" style={{background:'linear-gradient(90deg,var(--red),transparent)'}}></div>
    </div>
  );
}

// ---- Vue fiche ----
function DatasheetView({id, demo, onOpenDetachment, onOpenDatasheet, indexById}){
  const [d,setD]=useState(null); const [err,setErr]=useState(false);
  useEffect(()=>{ let on=true; setD(null); setErr(false);
    loadDatasheet(id,demo).then(x=>{ if(!on)return; if(x)setD(x); else setErr(true); });
    return ()=>{on=false};
  },[id,demo]);

  if(err) return <div className="p-4 muted">Fiche introuvable dans les données chargées.</div>;
  if(!d) return <div className="p-6 text-center muted mono text-sm">Chargement…</div>;

  const ab = d.abilities||{faction:[],core:[],datasheet:[]};
  return (
    <div className="fade-in px-4 pb-24 pt-3">
      <div className="disp text-[12px] uppercase tracking-[.15em]" style={{color:'var(--red)'}}>{d.faction?.name}{d.role? ' · '+d.role:''}</div>
      <h1 className="disp text-[30px] leading-none uppercase mt-0.5">{d.name}</h1>

      <div className="mt-3 space-y-3">
        {(d.models||[]).map((m,i)=><StatLine key={i} m={m}/>)}
      </div>

      {d.weapons && d.weapons.length ? (<>
        <SectionTitle kicker="Profils">Armes</SectionTitle>
        <div className="card rounded-lg px-3">
          {d.weapons.map((w,i)=><Weapon key={i} w={w}/>)}
        </div>
      </>):null}

      {ab.faction.length? (<>
        <SectionTitle kicker="Règle d'armée">Aptitudes de faction</SectionTitle>
        {ab.faction.map((a,i)=>(
          <div key={i} className="mb-2">
            <div className="disp text-[15px] uppercase tracking-wide ink">{a.name}{a.parameter? ' '+a.parameter:''}</div>
            <Html className="text-[13.5px] muted leading-relaxed" html={a.description_html}/>
          </div>
        ))}
      </>):null}

      {ab.datasheet.length? (<>
        <SectionTitle kicker="Fiche">Aptitudes</SectionTitle>
        {ab.datasheet.map((a,i)=>(
          <div key={i} className="mb-2">
            <div className="disp text-[15px] uppercase tracking-wide ink">{a.name}{a.parameter? ' '+a.parameter:''}{a.model? ' — '+a.model:''}</div>
            <Html className="text-[13.5px] muted leading-relaxed" html={a.description_html}/>
          </div>
        ))}
      </>):null}

      {ab.core.length? (<>
        <SectionTitle kicker="Universel">Aptitudes core</SectionTitle>
        <div className="flex flex-wrap gap-1.5">
          {ab.core.map((a,i)=><span key={i} className="chip rounded px-2 py-1 text-[12.5px] ink">{a.name}{a.parameter? ' '+a.parameter:''}</span>)}
        </div>
      </>):null}

      {(d.wargear_options||[]).length? (<>
        <SectionTitle kicker="Équipement">Options de wargear</SectionTitle>
        <ul className="space-y-1.5">
          {d.wargear_options.map((o,i)=>(
            <li key={i} className="text-[13.5px] muted flex gap-2"><span style={{color:'var(--red)'}}>›</span><Html html={o.description}/></li>
          ))}
        </ul>
      </>):null}

      {(d.unit_composition||[]).length? (<>
        <SectionTitle kicker="Unité">Composition</SectionTitle>
        <ul className="space-y-1 text-[13.5px] muted">
          {d.unit_composition.map((c,i)=><li key={i} className="flex gap-2"><span style={{color:'var(--red)'}}>›</span><Html html={c.description}/></li>)}
        </ul>
      </>):null}

      {(d.points||[]).length? (<>
        <SectionTitle kicker="Coût">Points</SectionTitle>
        <div className="flex flex-wrap gap-2">
          {d.points.map((p,i)=>(
            <div key={i} className="statbox rounded px-3 py-1.5 flex items-baseline gap-2">
              <span className="mono text-[18px] ink">{p.cost}</span>
              <span className="text-[12px] muted">{p.description}</span>
            </div>
          ))}
        </div>
      </>):null}

      {(d.leaders?.can_lead?.length || d.leaders?.can_be_led_by?.length)? (<>
        <SectionTitle kicker="Attachement">Leaders</SectionTitle>
        {d.leaders.can_lead?.length? <div className="mb-2"><div className="text-[12px] faint disp uppercase tracking-wide mb-1">Peut mener</div>
          <div className="flex flex-wrap gap-1.5">{d.leaders.can_lead.map((x,i)=><LinkPill key={i} x={x} indexById={indexById} onOpen={onOpenDatasheet}/>)}</div></div>:null}
        {d.leaders.can_be_led_by?.length? <div><div className="text-[12px] faint disp uppercase tracking-wide mb-1">Peut être mené par</div>
          <div className="flex flex-wrap gap-1.5">{d.leaders.can_be_led_by.map((x,i)=><LinkPill key={i} x={x} indexById={indexById} onOpen={onOpenDatasheet}/>)}</div></div>:null}
      </>):null}

      {(d.detachment_abilities||[]).length? (<>
        <SectionTitle kicker="Détachement">Aptitudes liées</SectionTitle>
        {d.detachment_abilities.map((a,i)=>(
          <button key={i} onClick={()=>a.detachment_id&&onOpenDetachment(a.detachment_id)} className="block text-left w-full card rounded-lg px-3 py-2 mb-1.5">
            <div className="disp text-[15px] uppercase ink">{a.name} <span className="faint text-[12px]">{a.detachment}</span></div>
            <Html className="text-[13px] muted mt-0.5" html={a.description_html}/>
          </button>
        ))}
      </>):null}

      {d.legend? <p className="mt-6 text-[12.5px] faint italic leading-relaxed">{d.legend}</p>:null}
    </div>
  );
}
function LinkPill({x, indexById, onOpen}){
  const known = indexById && indexById.has(x.id);
  return known
    ? <button onClick={()=>onOpen(x.id)} className="chip rounded px-2 py-1 text-[12.5px]" style={{color:'var(--steel)'}}>{x.name}</button>
    : <span className="chip rounded px-2 py-1 text-[12.5px] muted">{x.name}</span>;
}

// ---- Vue détachement ----
function DetachmentView({id, demo}){
  const [d,setD]=useState(null); const [err,setErr]=useState(false);
  useEffect(()=>{ let on=true; setD(null); setErr(false);
    loadDetachment(id,demo).then(x=>{ if(!on)return; x?setD(x):setErr(true); }); return ()=>{on=false};
  },[id,demo]);
  if(err) return <div className="p-4 muted">Détachement introuvable.</div>;
  if(!d) return <div className="p-6 text-center muted mono text-sm">Chargement…</div>;
  return (
    <div className="fade-in px-4 pb-24 pt-3">
      <div className="disp text-[12px] uppercase tracking-[.15em]" style={{color:'var(--red)'}}>{d.faction?.name}{d.type? ' · '+d.type:''}</div>
      <h1 className="disp text-[30px] leading-none uppercase mt-0.5">{d.name}</h1>

      {(d.rules||[]).length? (<>
        <SectionTitle kicker="Règle">Détachement</SectionTitle>
        {d.rules.map((r,i)=>(<div key={i} className="mb-2"><div className="disp text-[16px] uppercase ink">{r.name}</div><Html className="text-[13.5px] muted leading-relaxed" html={r.description_html}/></div>))}
      </>):null}

      {(d.stratagems||[]).length? (<>
        <SectionTitle kicker={d.stratagems.length+' au total'}>Stratagèmes</SectionTitle>
        <div className="space-y-2">
          {d.stratagems.map((s,i)=>(
            <div key={i} className="card rounded-lg px-3 py-2">
              <div className="flex items-start gap-2">
                <span className="mono text-[13px] px-1.5 py-0.5 rounded shrink-0" style={{background:'var(--red-deep)', color:'#fff'}}>{s.cp_cost}CP</span>
                <div className="disp text-[16px] uppercase leading-tight ink flex-1">{s.name}</div>
              </div>
              <div className="text-[11px] faint mt-1 mono">{[s.turn,s.phase].filter(Boolean).join(' · ')}</div>
              <Html className="text-[13px] muted mt-1 leading-relaxed" html={s.description_html}/>
            </div>
          ))}
        </div>
      </>):null}

      {(d.enhancements||[]).length? (<>
        <SectionTitle kicker={d.enhancements.length+' au total'}>Enhancements</SectionTitle>
        <div className="space-y-2">
          {d.enhancements.map((e,i)=>(
            <div key={i} className="card rounded-lg px-3 py-2">
              <div className="flex items-baseline gap-2">
                <div className="disp text-[16px] uppercase leading-tight ink flex-1">{e.name}</div>
                <span className="mono text-[13px]" style={{color:'var(--brass)'}}>{e.cost} pts</span>
              </div>
              <Html className="text-[13px] muted mt-1 leading-relaxed" html={e.description_html}/>
            </div>
          ))}
        </div>
      </>):null}
    </div>
  );
}

// ---- Liste ----
const CAP = 80;
function List({items, kind, onOpen, factionName}){
  const shown = items.slice(0,CAP);
  if(!items.length) return <div className="px-4 py-10 text-center muted">Aucun résultat. Ajuste la recherche ou les filtres.</div>;
  return (
    <div className="px-3 pb-24">
      {items.length>CAP? <div className="text-[12px] faint mono px-1 py-2">{items.length} résultats — affine pour voir les {items.length-CAP} autres</div>:
        <div className="text-[12px] faint mono px-1 py-2">{items.length} résultat{items.length>1?'s':''}</div>}
      <div className="space-y-1.5">
        {shown.map(it=>(
          <button key={it.id} onClick={()=>onOpen(it.id)} className="w-full text-left card rounded-lg px-3 py-2.5 active:translate-y-px transition">
            <div className="flex items-center gap-2">
              <div className="disp text-[17px] uppercase leading-tight ink flex-1">{it.name}</div>
              {kind==='ds' && it.min_points!=null? <span className="mono text-[12px]" style={{color:'var(--brass)'}}>{it.min_points}+</span>:null}
              {kind==='det'? <span className="mono text-[11px] faint">{it.n_stratagems}S · {it.n_enhancements}E</span>:null}
            </div>
            <div className="text-[11.5px] muted mt-0.5">
              {kind==='ds'? <>{factionName(it.faction_id)}{it.role? ' · '+it.role:''}</> : factionName(it.faction_id)}
            </div>
          </button>
        ))}
      </div>
    </div>
  );
}

// ---- App ----
function App(){
  const [state,setState]=useState({loading:true, demo:false, idx:null});
  const [section,setSection]=useState('ds'); // 'ds' | 'det'
  const [q,setQ]=useState('');
  const [faction,setFaction]=useState('');
  const [role,setRole]=useState('');
  const [nav,setNav]=useState(null); // {type:'ds'|'det', id}
  const scrollRef = useRef(0);

  useEffect(()=>{ loadIndex().then(({idx,demo})=>setState({loading:false,demo,idx})); },[]);

  const idx = state.idx;
  const factionName = useCallback(fid=>{
    const f = idx?.factions?.find(x=>x.id===fid); return f? f.name : fid;
  },[idx]);
  const indexById = useMemo(()=> idx? new Map(idx.datasheets.map(d=>[d.id,d])) : new Map(), [idx]);
  const roles = useMemo(()=> idx? Array.from(new Set(idx.datasheets.map(d=>d.role).filter(Boolean))).sort() : [], [idx]);

  const results = useMemo(()=>{
    if(!idx) return [];
    const nq = q.trim().toLowerCase();
    if(section==='ds'){
      return idx.datasheets.filter(d=>{
        if(faction && d.faction_id!==faction) return false;
        if(role && d.role!==role) return false;
        if(nq){
          if(d.name.toLowerCase().includes(nq)) return true;
          if((d.keywords||[]).some(k=>k.toLowerCase().includes(nq))) return true;
          return false;
        }
        return true;
      });
    } else {
      return idx.detachments.filter(d=>{
        if(faction && d.faction_id!==faction) return false;
        if(nq) return d.name.toLowerCase().includes(nq);
        return true;
      });
    }
  },[idx,section,q,faction,role]);

  const openDs=id=>{ scrollRef.current=window.scrollY; setNav({type:'ds',id}); window.scrollTo(0,0); };
  const openDet=id=>{ scrollRef.current=window.scrollY; setNav({type:'det',id}); window.scrollTo(0,0); };
  const back=()=>{ setNav(null); requestAnimationFrame(()=>window.scrollTo(0,scrollRef.current||0)); };

  if(state.loading) return <div className="min-h-screen flex items-center justify-center muted mono text-sm">Chargement de la base…</div>;

  return (
    <div className="min-h-screen">
      {/* Header */}
      <header className="sticky top-0 z-20" style={{background:'linear-gradient(180deg,#171a20,rgba(23,26,32,.96))', borderBottom:'1px solid var(--line)', paddingTop:'env(safe-area-inset-top)'}}>
        {nav? (
          <div className="flex items-center gap-2 px-3 h-12">
            <button onClick={back} className="disp uppercase text-[14px] px-2 py-1 rounded" style={{color:'var(--steel)'}}>‹ Retour</button>
            <div className="flex-1"></div>
            {state.demo? <DemoTag/>:null}
          </div>
        ):(
          <div className="px-3 pt-2 pb-2">
            <div className="flex items-center gap-2">
              <div className="disp text-[20px] uppercase tracking-wide leading-none">Codex<span style={{color:'var(--red)'}}>·</span>40K</div>
              <div className="flex-1"></div>
              {state.demo? <DemoTag/>:null}
            </div>
            {/* Segmented */}
            <div className="mt-2 grid grid-cols-2 gap-1 p-1 rounded-lg" style={{background:'var(--surface)'}}>
              {[['ds','Fiches'],['det','Détachements']].map(([k,label])=>(
                <button key={k} onClick={()=>{setSection(k); setRole('');}} className={"disp uppercase text-[14px] py-1.5 rounded-md tracking-wide "+(section===k?'seg-active':'muted')}>{label}</button>
              ))}
            </div>
            {/* Search + filters */}
            <div className="mt-2 flex gap-2">
              <input value={q} onChange={e=>setQ(e.target.value)} placeholder={section==='ds'? 'Nom ou mot-clé…':'Nom de détachement…'} inputMode="search"
                className="flex-1 rounded-lg px-3 py-2 text-[15px] ink" style={{background:'var(--surface2)', border:'1px solid var(--line)'}}/>
              {(q||faction||role)? <button onClick={()=>{setQ('');setFaction('');setRole('');}} className="disp uppercase text-[12px] px-2 rounded-lg muted" style={{border:'1px solid var(--line)'}}>Effacer</button>:null}
            </div>
            <div className="mt-2 flex gap-2 overflow-x-auto scroll-x pb-0.5">
              <Select value={faction} onChange={setFaction} placeholder="Toutes factions" options={(idx.factions||[]).map(f=>[f.id,f.name])}/>
              {section==='ds'? <Select value={role} onChange={setRole} placeholder="Tous rôles" options={roles.map(r=>[r,r])}/>:null}
            </div>
          </div>
        )}
      </header>

      {/* Body */}
      <main>
        {nav?.type==='ds'? <DatasheetView id={nav.id} demo={state.demo} indexById={indexById} onOpenDetachment={openDet} onOpenDatasheet={openDs}/> : null}
        {nav?.type==='det'? <DetachmentView id={nav.id} demo={state.demo}/> : null}
        {!nav? <List items={results} kind={section} onOpen={section==='ds'?openDs:openDet} factionName={factionName}/> : null}
      </main>
    </div>
  );
}

function Select({value,onChange,placeholder,options}){
  return (
    <select value={value} onChange={e=>onChange(e.target.value)}
      className="disp uppercase text-[13px] tracking-wide rounded-lg px-2.5 py-1.5 shrink-0"
      style={{background:'var(--surface2)', border:'1px solid var(--line)', color: value?'var(--ink)':'var(--muted)'}}>
      <option value="">{placeholder}</option>
      {options.map(([v,l])=><option key={v} value={v} style={{color:'#111'}}>{l}</option>)}
    </select>
  );
}
function DemoTag(){
  return <span className="mono text-[10px] px-1.5 py-0.5 rounded" style={{color:'var(--brass)', border:'1px solid var(--line)'}} title="Aperçu — déploie avec ton dossier output/ pour la base complète">DÉMO</span>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
