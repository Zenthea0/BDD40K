st 1 wound. A 3 is rolled to see how many wounds are reanimated. The first of these reanimated wounds restores the wounded Lokhust Destroyer back to 3 wounds. The second of these reanimated wounds returns the destroyed Lokhust Destroyer to the battlefield with 1 wound remaining. The third of these reanimated wounds restores one of the remaining lost wounds to the same Lokhust Destroyer that was just returned. The unit now contains 3 models, two of which have 3 wounds remaining and one of which has 2 wounds remaining.<\/div>", "description_text": "If your Army Faction is NECRONS, at the end of your Command phase, each unit from your army with this ability that is on the battlefield activates its Reanimation Protocols and reanimates D3 wounds. Each time such a unit reanimates a wound:\nIf that unit contains one or more models with fewer than their starting number of wounds remaining, select one of those models; that model regains one lost wound\nIf all models in that unit have their starting number of wounds, but that unit is not at its Starting Strength, one destroyed model is returned to that unit with one wound remaining.\nOnce such a unit is at its Starting Strength and all of its models have their starting number of wounds, nothing further happens.\n\nExample: A unit of Lokhust Destroyers (which have a Wounds characteristic of 3) activates its Reanimation Protocols. The unit had a Starting Strength of 3, but currently contains 2 models, and one of those models has lost 1 wound. A 3 is rolled to see how many wounds are reanimated. The first of these reanimated wounds restores the wounded Lokhust Destroyer back to 3 wounds. The second of these reanimated wounds returns the destroyed Lokhust Destroyer to the battlefield with 1 wound remaining. The third of these reanimated wounds restores one of the remaining lost wounds to the same Lokhust Destroyer that was just returned. The unit now contains 3 models, two of which have 3 wounds remaining and one of which has 2 wounds remaining."}], "core": [{"name": "Leader", "model": null, "parameter": null, "description_html": "<div class=\"Corner33 abWrap BreakInsideAvoid\"><div class=\"abFlex\"><div class=\"abDiamondWrap\"><div class=\"abDiamond\"><div class=\"abIcon\"><\/div><\/div><\/div><div class=\"abLine\"><\/div><div class=\"abNameWrap\"><div class=\"abName\">LEADER<\/div><\/div><\/div><p style=\"padding-bottom:8px\" class=\"ShowFluff stratLegend2\">Mighty heroes fight at the forefront of battle.<\/p>Some <span class=\"kwb\">CHARACTER<\/span> units have ‘Leader’ listed on their datasheets. Such <span class=\"kwb\">CHARACTER<\/span> units are known as Leaders, and the units they can lead – known as their Bodyguard units – are listed on their datasheet.<br><br>During the Declare Battle Formations step, for each Leader in your army, if your army also includes one or more of that Leader’s Bodyguard units, you can select one of those Bodyguard units. That Leader will then attach to that Bodyguard unit for the duration of the battle and is said to be leading that unit. Each Bodyguard unit can only have one Leader attached to it.<br><br>While a Bodyguard unit contains a Leader, it is known as an Attached unit and, with the exception of rules that are triggered when units are <span class=\"tooltip00006\" data-tooltip-content=\"#tooltip_content00006\"><span class=\"tt kwbu\">destroyed<\/span><\/span>, it is treated as a single unit for all rules purposes. Each time an attack targets an Attached unit, until the attacking unit has resolved all of its attacks, you must use the Toughness characteristic of the Bodyguard models in that unit, even if a Leader in that unit has a different Toughness characteristic. Each time an attack sucessfully wounds an Attached unit, that attack cannot be allocated to a <span class=\"kwb\">CHARACTER<\/span> model in that unit, even if that <span class=\"kwb\">CHARACTER<\/span> model has lost one or more wounds or has already had attacks allocated to it this phase. As soon as the last Bodyguard model in an Attached unit has been destroyed, any attacks made against that unit that have yet to be allocated can then be allocated to <span class=\"kwb\">CHARACTER<\/span> models in that unit.<br><br>Each time the last model in a Bodyguard unit is destroyed, each <span class=\"kwb\">CHARACTER<\/span> unit that is part of that Attached unit is no longer part of an Attached unit. It becomes a separate unit, with its original Starting Strength. If this happens as the result of an attack, they become separate units after the attacking unit has resolved all of its attacks.<br><br>Each time the last model in a <span class=\"kwb\">CHARACTER<\/span> unit that is attached to a Bodyguard unit is destroyed and there is not another <span class=\"kwb\">CHARACTER<\/span> unit attached, that Attached unit’s Bodyguard unit is no longer part of an Attached unit. It becomes a separate unit, with its original Starting Strength. If this happens as the result of an attack, they become separate units after the attacking unit has resolved all of its attacks. <br><br>Each time a unit that is part of an Attached unit is destroyed, it does not have the keywords of any other units that make up that Attached unit (unless it has those keywords on its own datasheet) for the purposes of any rules that would be triggered when that unit is destroyed.<br><br><div class=\"redExample\"><b>Example:<\/b> <i>If you only destroy the Bodyguard unit that is part of an Attached unit, you have not destroyed a <span class=\"kwb\">CHARACTER<\/span> unit. If you only destroy the <span class=\"kwb\">CHARACTER<\/span> unit that is part of an Attached unit, or if you destroy the whole Attached unit, you have destroyed one <span class=\"kwb\">CHARACTER<\/span> unit.<\/i><\/div><br><div class=\"BreakInsideAvoid frameLight Corner14\" style=\"\"><ul class=\"redSquare\"><li>Before the battle, <span class=\"kwb\">CHARACTER<\/span> units with the Leader ability can be attached to one of their Bodyguard units to form an Attached unit.<\/li><li>Attached units can only contain one Leader.<\/li><li>Attacks cannot be allocated to <span class=\"kwb\">CHARACTER<\/span> models in Attached units.<\/li><\/ul><\/div><\/div>", "description_text": "LEADER\n\nMighty heroes fight at the forefront of battle.\nSome CHARACTER units have ‘Leader’ listed on their datasheets. Such CHARACTER units are known as Leaders, and the units they can lead – known as their Bodyguard units – are listed on their datasheet.\n\nDuring the Declare Battle Formations step, for each Leader in your army, if your army also includes one or more of that Leader’s Bodyguard units, you can select one of those Bodyguard units. That Leader will then attach to that Bodyguard unit for the duration of the battle and is said to be leading that unit. Each Bodyguard unit can only have one Leader attached to it.\n\nWhile a Bodyguard unit contains a Leader, it is known as an Attached unit and, with the exception of rules that are triggered when units are destroyed, it is treated as a single unit for all rules purposes. Each time an attack targets an Attached unit, until the attacking unit has resolved all of its attacks, you must use the Toughness characteristic of the Bodyguard models in that unit, even if a Leader in that unit has a different Toughness characteristic. Each time an attack sucessfully wounds an Attached unit, that attack cannot be allocated to a CHARACTER model in that unit, even if that CHARACTER model has lost one or more wounds or has already had attacks allocated to it this phase. As soon as the last Bodyguard model in an Attached unit has been destroyed, any attacks made against that unit that have yet to be allocated can then be allocated to CHARACTER models in that unit.\n\nEach time the last model in a Bodyguard unit is destroyed, each CHARACTER unit that is part of that Attached unit is no longer part of an Attached unit. It becomes a separate unit, with its original Starting Strength. If this happens as the result of an attack, they become separate units after the attacking unit has resolved all of its attacks.\n\nEach time the last model in a CHARACTER unit that is attached to a Bodyguard unit is destroyed and there is not another CHARACTER unit attached, that Attached unit’s Bodyguard unit is no longer part of an Attached unit. It becomes a separate unit, with its original Starting Strength. If this happens as the result of an attack, they become separate units after the attacking unit has resolved all of its attacks.\n\nEach time a unit that is part of an Attached unit is destroyed, it does not have the keywords of any other units that make up that Attached unit (unless it has those keywords on its own datasheet) for the purposes of any rules that would be triggered when that unit is destroyed.\n\nExample: If you only destroy the Bodyguard unit that is part of an Attached unit, you have not destroyed a CHARACTER unit. If you only destroy the CHARACTER unit that is part of an Attached unit, or if you destroy the whole Attached unit, you have destroyed one CHARACTER unit.\n\nBefore the battle, CHARACTER units with the Leader ability can be attached to one of their Bodyguard units to form an Attached unit.\nAttached units can only contain one Leader.\nAttacks cannot be allocated to CHARACTER models in Attached units."}], "datasheet": [{"name": "Resurrection Orb", "model": null, "parameter": null, "description_html": "Once per battle, while the bearer is leading a unit, at the end of any phase, it can resurrect that unit if it is on the battlefield. When you do, that unit’s Reanimation Protocols are activated, reanimating D6 wounds rather than D3 when doing so. You cannot resurrect more than one unit per turn.", "description_text": "Once per battle, while the bearer is leading a unit, at the end of any phase, it can resurrect that unit if it is on the battlefield. When you do, that unit’s Reanimation Protocols are activated, reanimating D6 wounds rather than D3 when doing so. You cannot resurrect more than one unit per turn."}, {"name": "My Will Be Done", "model": null, "parameter": null, "description_html": "Once per battle round, one unit from your army with this ability can use it when its unit is targeted with a Stratagem. If it does, reduce the CP cost of that use of that Stratagem by 1CP.", "description_text": "Once per battle round, one unit from your army with this ability can use it when its unit is targeted with a Stratagem. If it does, reduce the CP cost of that use of that Stratagem by 1CP."}, {"name": "Implacable Resilience", "model": null, "parameter": null, "description_html": "Each time an attack is allocated to this model, subtract 1 from that attack’s Damage characteristic.", "description_text": "Each time an attack is allocated to this model, subtract 1 from that attack’s Damage characteristic."}, {"name": "One Shot", "model": null, "parameter": null, "description_html": "The bearer can only shoot with this weapon once per battle.", "description_text": "The bearer can only shoot with this weapon once per battle."}]}, "keywords": ["Overlord", "Noble", "Character", "Infantry"], "faction_keywords": ["Necrons"], "unit_composition": [{"line": "1", "description": "1 Overlord"}], "wargear_options": [{"line": "1", "description": "This model’s tachyon arrow and Overlord’s blade can be replaced with one of the following:<ul style=\"list-style-type:circle\"><li>1 staff of light<\/li><li>1 voidscythe<\/li><\/ul>"}, {"line": "2", "description": "If this model is not equipped with a tachyon arrow, it can be equipped with 1 resurrection orb."}], "points": [{"description": "1 model", "cost": "85"}], "leaders": {"can_lead": [], "can_be_led_by": []}, "detachment_abilities": [{"id": "000008549", "detachment_id": "000000817", "detachment": "Obeisance Phalanx", "name": "Worthy Foes", "description_html": "In your Command phase, select one enemy unit. Until the start of your next Command phase, each ti  "Conquest Protocols", "description_html": "Each time a <span class=\"kwb\">NECRONS<\/span> model from your army makes an attack, if that model is within range of an objective marker or the target of that attack is within range of an objective marker, on a Critical Wound, improve the Armour Penetration characteristic of that attack by 1.", "description_text": "Each time a NECRONS model from your army makes an attack, if that model is within range of an objective marker or the target of that attack is within range of an objective marker, on a Critical Wound, improve the Armour Penetration characteristic of that attack by 1."}, {"id": "000009748", "detachment_id": "000000985", "detachment": "Starshatter Arsenal", "name": "Relentless Onslaught", "description_html": "Each time a <span class=\"kwb\">NECRONS<\/span> model (excluding Monster models) from your army makes an attack that targets a unit within range of one or more objective markers, add 1 to the Hit roll. In addition, ranged weapons equipped by Necrons Vehicle and Necrons Mounted models (excluding Titanic models) from your army have the [ASSAULT] ability.", "description_text": "Each time a NECRONS model (excluding Monster models) from your army makes an attack that targets a unit within range of one or more objective markers, add 1 to the Hit roll. In addition, ranged weapons equipped by Necrons Vehicle and Necrons Mounted models (excluding Titanic models) from your army have the [ASSAULT] ability."}, {"id": "000008370", "detachment_id": "000000756", "detachment": "Awakened Dynasty", "name": "Command Protocols", "description_html": "While a Necrons Character model is leading this unit, each time a model in this unit makes an attack, add 1 to the Hit roll.", "description_text": "While a Necrons Character model is leading this unit, each time a model in this unit makes an attack, add 1 to the Hit roll."}], "link": "https://wahapedia.ru/wh40k10ed/factions/necrons/Overlord"}, "000002110": {"id": "000002110", "name": "Skorpekh Destroyers", "faction": {"id": "NEC", "name": "Necrons"}, "source": {"name": "Necrons", "type": "Faction Pack", "edition": "10", "version": "1.3", "errata_date": "04.03.2026 0:00:00"}, "role": "Other", "legends": false, "allied_from": null, "legend": "Skorpekh Destroyers favour overwhelming close-quarters violence to slaughter their victims. Though ungainly off the battlefield, in combat their tripod limbs allow them to pass through enemy lines in a madcap pirouette of slashing hyperphase blades, nigh on impossible to evade or parry.", "loadout": "<b>Every model is equipped with:<\/b> Skorpekh hyperphase weapons.", "transport": null, "virtual": false, "models": [{"name": "Skorpekh Destroyers", "M": "8\"", "T": "6", "Sv": "3+", "inv_sv": "-", "inv_sv_descr": null, "W": "3", "Ld": "7+", "OC": "2", "base_size": "50mm"}], "weapons": [{"name": "Skorpekh hyperphase weapons", "type": "Melee", "range": "Melee", "A": "4", "BS_WS": "3", "S": "7", "AP": "-2", "D": "2", "abilities": []}], "abilities": {"faction": [{"name": "Reanimation Protocols", "model": null, "parameter": null, "description_html": "If your Army Faction is <span class=\"kwb\">NECRONS<\/span>, at the end of your Command phase, each unit from your army with this ability that is on the battlefield activates its Reanimation Protocols and reanimates D3 wounds. Each time such a unit reanimates a wound:<br><ul><li>If that unit contains one or more models with fewer than their starting number of wounds remaining, select one of those models; that model regains one lost wound<\/li><li>If all models in that unit have their starting number of wounds, but that unit is not at its Starting Strength, one destroyed model is returned to that unit with one wound remaining.<\/li><\/ul>Once such a unit is at its Starting Strength and all of its models have their starting number of wounds, nothing further happens.<br><br><div class=\"redExample\"><b>Example:<\/b> A unit of Lokhust Destroyers (which have a Wounds chara  wounds to the same Lokhust Destroyer that was just returned. The unit now contains 3 models, two of which have 3 wounds remaining and one of which has 2 wounds remaining."}], "core": [], "datasheet": [{"name": "Plasmacyte", "model": null, "parameter": null, "description_html": "Once per battle for each Plasmacyte this unit has, when this unit is selected to fight, you can use this ability. If you do, until the end of the phase, melee weapons equipped by models in this unit have the [DEVASTATING WOUNDS] ability.  <br><br><b>Designer’s Note:<\/b> <i>Place the relevant number of Plasmacyte tokens next to the unit, removing one each time this unit uses this ability.<\/i>", "description_text": "Once per battle for each Plasmacyte this unit has, when this unit is selected to fight, you can use this ability. If you do, until the end of the phase, melee weapons equipped by models in this unit have the [DEVASTATING WOUNDS] ability.\n\nDesigner’s Note: Place the relevant number of Plasmacyte tokens next to the unit, removing one each time this unit uses this ability."}, {"name": "Whirling Onslaught", "model": null, "parameter": null, "description_html": "Each time a model in this unit makes a melee attack, re-roll a Hit roll of 1. If this unit made a Charge move this turn, you can re-roll the Hit roll instead.", "description_text": "Each time a model in this unit makes a melee attack, re-roll a Hit roll of 1. If this unit made a Charge move this turn, you can re-roll the Hit roll instead."}]}, "keywords": ["Skorpekh Destroyers", "Destroyer Cult", "Infantry"], "faction_keywords": ["Necrons"], "unit_composition": [{"line": "1", "description": "3-6 Skorpekh Destroyers"}], "wargear_options": [{"line": "1", "description": "For every 3 models in this unit, this unit can have 1 Plasmacyte."}], "points": [{"description": "3 models", "cost": "90"}, {"description": "6 models", "cost": "180"}], "leaders": {"can_lead": [], "can_be_led_by": []}, "detachment_abilities": [{"id": "000009748 tom;width:160px;height:0px;\"><\/td><td style=\"border-width:0 0 0 0;border-style:none none none none;vertical-align:bottom;width:320px;height:0px;\"><\/td><\/tr><\/tbody><\/table><\/td><\/tr><\/tbody><\/table><\/div><br>Once you have made your selections, remove those units from the battlefield and place them into Strategic Reserves.", "description_text": "At the end of your opponent’s turn, you can select a number of NECRONS units from your army (excluding units that are within Engagement Range of one or more enemy units). The maximum number of units you can select depends on the battle size, as follows:\n\nBATTLE SIZENUMBER OF UNITS\nIncursionUp to 1 units\nStrike ForceUp to 2 units\nOnslaughtUp to 3 units\n\nOnce you have made your selections, remove those units from the battlefield and place them into Strategic Reserves."}, {"id": "000009587", "detachment_id": "000000959", "detachment": "Tomb Ship Complement", "name": "Conquest Protocols", "description_html": "Each time a <span class=\"kwb\">NECRONS<\/span> model from your army makes an attack, if that model is within range of an objective marker or the target of that attack is within range of an objective marker, on a Critical Wound, improve the Armour Penetration characteristic of that attack by 1.", "description_text": "Each time a NECRONS model from your army makes an attack, if that model is within range of an objective marker or the target of that attack is within range of an objective marker, on a Critical Wound, improve the Armour Penetration characteristic of that attack by 1."}, {"id": "000010667", "detachment_id": "000001128", "detachment": "Cursed Legion", "name": "Cold Fervour", "description_html": "<ul><li>Add 2 to the Strength characteristic of weapons equipped by Destroyer Cult models from your army.<\/li><li>The first time each turn that a <span class=\"kwb\">DESTROYER<\/span> <span class=\"kwb\">CULT<\/span> unit from your army makes attacks that destroy a unit or cause it to become Below Half-strength, after that unit has finished resolving its attacks, until the end of the turn, add 2 to the Strength characteristic of weapons equipped by friendly <span class=\"kwb\">NECRONS<\/span> models (excluding <span class=\"kwb\">DESTROYER<\/span> <span class=\"kwb\">CULT<\/span>, Monster and Titanic models).<\/li><\/ul>", "description_text": "Add 2 to the Strength characteristic of weapons equipped by Destroyer Cult models from your army.\nThe first time each turn that a DESTROYER CULT unit from your army makes attacks that destroy a unit or cause it to become Below Half-strength, after that unit has finished resolving its attacks, until the end of the turn, add 2 to the Strength characteristic of weapons equipped by friendly NECRONS models (excluding DESTROYER CULT, Monster and Titanic models)."}], "link": "https://wahapedia.ru/wh40k10ed/factions/necrons/Skorpekh-Destroyers"}, "000000531": {"id": "000000531", "name": "Anrakyr The Traveller", "faction": {"id": "NEC", "name": "Necrons"}, "source": {"name": "Necrons (Warhammer Legends)", "type": "Faction Pack", "edition": "0", "version": "", "errata_date": "01.01.0001 0:00:00"}, "role": "Characters", "legends": true, "allied_from": null, "legend": "Anrakyr voyages from one tomb world to the next at the head of his veteran Pyrrhian Eternals. His tachyon arrow can unleash an unstoppable thunderbolt of energy, capable of shattering mountains, and his will is so great that he can even seize temporary control of his enemies’ engines of war.", "loadout": "<b>This model is equipped with:<\/b> tachyon arrow; warscythe.", "transport": null, "virtual": false, "models": [{"name": "Anrakyr The Traveller", "M": "5\"", "T": "5", "Sv": "2+", "inv_sv": "4", "inv_sv_descr": null, "W": "6", "Ld": "6+", "OC": "1", "base_size": "25mm"}], "weapons": [{"name": "Tachyon arrow", "type": "Ranged", "range": "72", "A": "1", "BS_WS": "2", "S": "16", "AP": "-5", "D": "D6+2", "abilities": [{"keyword": "one shot", "value": null, "anti_target": null, "anti_threshold": null, "known": true, "raw": "one shot"}]}, {"name": "Warscythe", "type": "Melee", "range": "Melee", "A": "4", "BS_WS": "2", "S": "8", "AP": "-3", "D": "2", "abilities": [{"keyword": "devastating wounds", "value": null, "anti_target": null, "anti_threshold": null, "known": true, "raw": "devastating wounds"}]}], "abilities": {"faction": [{"name": "Reanimation Protocols", "model": null, "parameter": null, "description_html": "If your Army Faction is <span class=\"kwb\">NECRONS<\/span>, at the end of your Command phase, each unit from your army with this ability that is on the battlefield activates its Reanimation Protocols and reanimates D3 wounds. Each time such a unit reanimates a wound:<br><ul><li>If that unit contains one or more models with fewer than their starting number of wounds remaining, select one of those models; that model regains one lost wound<\/li><li>If all models in that unit have their starting number of wounds, but that unit is not at its Starting Strength, one destroyed model is returned to that unit with one wound remaining.<\/li><\/ul>Once such a unit is at its Starting Strength and all of its models have their starting number of wounds, nothing further happens.<br><br><div class=\"redExample\"><b>Example:<\/b> A unit of Lokhust Destroyers (which have a Wounds characteristic of 3) activates its Reanimation Protocols. The unit had a Starting Strength of 3, but currently contains 2 models, and one of those models has lost 1 wound. A 3 is rolled to see how many wounds are reanimated. The first of these reanimated wounds restores the wounded Lokhust Destroyer back to 3 wounds. The second of these reanimated wounds returns the destroyed Lokhust Destroyer to the battlefield with 1 wound remaining. The third of these reanimated wounds restores one of the remaining lost wounds to the same Lokhust Destroyer that was just returned. The unit now contains 3 models, two of which have 3 wounds remaining and one of which has 2 wounds remaining.<\/div>", "description_text": "If your Army Faction is NECRONS, at the end of your Command phase, each unit from your army with this ability that is on the battlefield activates its Reanimation Protocols and reanimates D3 wounds. Each time such a unit reanimates a wound:\nIf that unit contains one or more models with fewer than their starting number of wounds remaining, select one of those models; that model regains one lost wound\nIf all models in that unit have their starting number of wounds, but that unit is not at its Starting Strength, one destroyed model is returned to that unit with one wound remaining.\nOnce such a unit is at its Starting Strength and all of its models have their starting number of wounds, nothing further happens.\n\nExample: A unit of Lokhust Destroyers (which have a Wounds characteristic of 3) activates its Reanimation Protocols. The unit had a Starting Strength of 3, but currently contains 2 models, and one of those models has lost 1 wound. A 3 is rolled to see how many wounds are reanimated. The first of these reanimated wounds restores the wounded Lokhust Destroyer back to 3 wounds. The second of these reanimated wounds returns the destroyed Lokhust Destroyer to the battlefield with 1 wound remaining. The third of these reanimated wounds restores one of the remaining lost wounds to the same Lokhust Destroyer that was just returned. The unit now contains 3 models, two of which have 3 wounds remaining and one of which has 2 wounds remaining."}], "core": [{"name": "Leader", "model": null, "parameter": null, "description_html": "<div class=\"Corner33 abWrap BreakInsideAvoid\"><div class=\"abFlex\"><div class=\"abDiamondWrap\"><div class=\"abDiamond\"><div class=\"abIcon\"><\/div><\/div><\/div><div class=\"abLine\"><\/div><div class=\"abNameWrap\"><div class=\"abName\">LEADER<\/div><\/div><\/div><p style=\"padding-bottom:8px\" class=\"ShowFluff stratLegend2\">Mighty heroes fight at the forefront of battle.<\/p>Some <span class=\"kwb\">CHARACTER<\/span> units have ‘Leader’ listed on their datasheets. Such <span class=\"kwb\">CHARACTER<\/span> units are known as Leaders, and the units they can lead – known as their Bodyguard units – are listed on their datasheet.<br><br>During the Declare Battle Formations step, for each Leader in your army, if your army also includes one or more of that Leader’s Bodyguard units, you can select one of those Bodyguard units. That Leader will then attach to that Bodyguard unit for the duration of the battle and is said to be leading that unit. Each Bodyguard unit can only have one Leader attached to it.<br><br>While a Bodyguard unit contains a Leader, it is known as an Attached unit and, with the exception of rules that are triggered when units are <span class=\"tooltip00006\" data-tooltip-content=\"#tooltip_content00006\"><span class=\"tt kwbu\">destroyed<\/span><\/span>, it is treated as a single unit for all rules purposes. Each time an attack targets an Attached unit, until the attacking unit has resolved all of its attacks, you must use the Toughness characteristic of the Bodyguard models in that unit, even if a Leader in that unit has a different Toughness characteristic. Each time an attack sucessfully wounds an Attached unit, that attack cannot be allocated to a <span class=\"kwb\">CHARACTER<\/span> model in that unit, even if that <span class=\"kwb\">CHARACTER<\/span> model has lost one or more wounds or has already had attacks allocated to it this phase. As soon as the last Bodyguard model in an Attached unit has been destroyed, any attacks made against that unit that have yet to be allocated can then be allocated to <span class=\"kwb\">CHARACTER<\/span> models in that unit.<br><br>Each time the last model in a Bodyguard unit is destroyed, each <span class=\"kwb\">CHARACTER<\/span> unit that is part of that Attached unit is no longer part of an Attached unit. It becomes a separate unit, with its original Starting Strength. If this happens as the result of an attack, they become separate units after the attacking unit has resolved all of its attacks.<br><br>Each time the last model in a <span class=\"kwb\">CHARACTER<\/span> unit that is attached to a Bodyguard unit is destroyed and there is not another <span class=\"kwb\">CHARACTER<\/span> unit attached, that Attached unit’s Bodyguard unit is no longer part of an Attached unit. It becomes a separate unit, with its original Starting Strength. If this happens as the result of an attack, they become separate units after the attacking unit has resolved all of its attacks. <br><br>Each time a unit that is part of an Attached unit is destroyed, it does not have the keywords of any other units that make up that Attached unit (unless it has those keywords on its own datasheet) for the purposes of any rules that would be triggered when that unit is destroyed.<br><br><div class=\"redExample\"><b>Example:<\/b> <i>If you only destroy the Bodyguard unit that is part of an Attached unit, you have not destroyed a <span class=\"kwb\">CHARACTER<\/span> unit. If you only destroy the <span class=\"kwb\">CHARACTER<\/span> unit that is part of an Attached unit, or if you destroy the whole Attached unit, you have destroyed one <span class=\"kwb\">CHARACTER<\/span> unit.<\/i><\/div><br><div class=\"BreakInsideAvoid frameLight Corner14\" style=\"\"><ul class=\"redSquare\"><li>Before the battle, <span class=\"kwb\">CHARACTER<\/span> units with the Leader ability can be attached to one of their Bodyguard units to form an Attached unit.<\/li><li>Attached units can only contain one Leader.<\/li><li>Attacks cannot be allocated to <span class=\"kwb\">CHARACTER<\/span> models in Attached units.<\/li><\/ul><\/div><\/div>", "description_text": "LEADER\n\nMighty heroes fight at the forefront of battle.\nSome CHARACTER units have ‘Leader’ listed on their datasheets. Such CHARACTER units are known as Leaders, and the units they can lead – known as their Bodyguard units – are listed on their datasheet.\n\nDuring the Declare Battle Formations step, for each Leader in your army, if your army also includes one or more of that Leader’s Bodyguard units, you can select one of those Bodyguard units. That Leader will then attach to that Bodyguard unit for the duration of the battle and is said to be leading that unit. Each Bodyguard unit can only have one Leader attached to it.\n\nWhile a Bodyguard unit contains a Leader, it is known as an Attached unit and, with the exception of rules that are triggered when units are destroyed, it is treated as a single unit for all rules purposes. Each time an attack targets an Attached unit, until the attacking unit has resolved all of its attacks, you must use the Toughness characteristic of the Bodyguard models in that unit, even if a Leader in that unit has a different Toughness characteristic. Each time an attack sucessfully wounds an Attached unit, that attack cannot be allocated to a CHARACTER model in that unit, even if that CHARACTER model has lost one or more wounds or has already had attacks allocated to it this phase. As soon as the last Bodyguard model in an Attached unit has been destroyed, any attacks made against that unit that have yet to be allocated can then be allocated to CHARACTER models in that unit.\n\nEach time the last model in a Bodyguard unit is destroyed, each CHARACTER unit that is part of that Attached unit is no longer part of an Attached unit. It becomes a separate unit, with its original Starting Strength. If this happens as the result of an attack, they become separate units after the attacking unit has resolved all of its attacks.\n\nEach time the last model in a CHARACTER unit that is attached to a Bodyguard unit is destroyed and there is not another CHARACTER unit attached, that Attached unit’s Bodyguard unit is no longer part of an Attached unit. It becomes a separate unit, with its original Starting Strength. If this happens as the result of an attack, they become separate units after the attacking unit has resolved all of its attacks.\n\nEach time a unit that is part of an Attached unit is destroyed, it does not have the keywords of any other units that make up that Attached unit (unless it has those keywords on its own datasheet) for the purposes of any rules that would be triggered when that unit is destroyed.\n\nExample: If you only destroy the Bodyguard unit that is part of an Attached unit, you have not destroyed a CHARACTER unit. If you only destroy the CHARACTER unit that is part of an Attached unit, or if you destroy the whole Attached unit, you have destroyed one CHARACTER unit.\n\nBefore the battle, CHARACTER units with the Leader ability can be attached to one of their Bodyguard units to form an Attached unit.\nAttached units can only contain one Leader.\nAttacks cannot be allocated to CHARACTER models in Attached units."}], "datasheet": [{"name": "Lord of the Pyrrhian Eternals", "model": null, "parameter": null, "description_html": "While this model is leading a unit, each time a model in that unit makes an attack, add 1 to the Wound roll.", "description_text": "While this model is leading a unit, each time a model in that unit makes an attack, add 1 to the Wound roll."}, {"name": "Mind in the Machine", "model": null, "parameter": null, "description_html": "At the start of your opponent’s Shooting phase, select one enemy <span class=\"kwb\">VEHICLE<\/span> unit within 12\" of and visible to this model. That unit must take a Leadership test. If that test is passed, until the end of the phase, each time a model in that unit makes an attack, subtract 1 from the Hit roll; if that test is failed, that unit is not eligible to shoot this phase.", "description_text": "At the start of your opponent’s Shooting phase, select one enemy VEHICLE unit within 12\" of and visible to this model. That unit must take a Leadership test. If that test is passed, until the end of the phase, each time a model in that unit makes an attack, subtract 1 from the Hit roll; if that test is failed, that unit is not eligible to shoot this phase."}, {"name": "One Shot", "model": null, "parameter": null, "description_html": "The bearer can only shoot with this weapon once per battle.", "description_text": "The bearer can only shoot with this weapon once per battle."}]}, "keywords": ["Infantry", "Character", "Anrakyr the Traveller", "Epic Hero", "Noble"], "faction_keywords": ["Necrons"], "unit_composition": [{"line": "1", "description": "1 Anrakyr the Traveller – <span class=\"kwb\">EPIC<\/span> <span class=\"kwb\">HERO<\/span>"}], "wargear_options": [{"line": "1", "description": "None"}], "points": [{"description": "1 model", "cost": "95"}], "leaders": {"can_lead": [], "can_be_led_by": []}, "detachment_abilities": [{"id": "000008370", "detachment_id": "000000756", "detachment": "Awakened Dynasty", "name": "Command Protocols", "description_html": "While a Necrons Character model is leading this unit, each time a model in this unit makes an attack, add 1 to the Hit roll.", "description_text": "While a Necrons Character model is leading this unit, each time a model in this unit makes an attack, add 1 to the Hit roll."}, {"id": "000008553", "detachment_id": "000000818", "detachment": "Hypercrypt Legion", "name": "Hyperphasing", "description_html": "At the end of your opponent’s turn, you can select a number of <span class=\"kwb\">NECRONS<\/span> units from your army (excluding units that are within Engagement Range of one or more enemy units). The maximum number of units you can select depends on the battle size, as follows:<br><br><div class=\"BreakInsideAvoid\"  style=\"\"\"><table width=\"0\" border=\"0\" bordercolor=\"#888\" cellpadding=\"4\" cellspacing=\"0\" style=\"border-collapse:collapse;border-width:0px\"><tbody><tr><td><table class=\" customTable tablefont\" border=\"1\" bordercolor=\"#888\" cellpadding=\"4\" style=\"border-collapse:collapse;border-color:#888888;border-width:0px\"><tbody><tr><td style=\"border-width:1px 1px 1px 1px at targets that unit, add 1 to the Wound roll."}, {"id": "000010667", "detachment_id": "000001128", "detachment": "Cursed Legion", "name": "Cold Fervour", "description_html": "<ul><li>Add 2 to the Strength characteristic of weapons equipped by Destroyer Cult models from your army.<\/li><li>The first time each turn that a <span class=\"kwb\">DESTROYER<\/span> <span class=\"kwb\">CULT<\/span> unit from your army makes attacks that destroy a unit or cause it to become Below Half-strength, after that unit has finished resolving its attacks, until the end of the turn, add 2 to the Strength characteristic of weapons equipped by friendly <span class=\"kwb\">NECRONS<\/span> models (excluding <span class=\"kwb\">DESTROYER<\/span> <span class=\"kwb\">CULT<\/span>, Monster and Titanic models).<\/li><\/ul>", "description_text": "Add 2 to the Strength characteristic of weapons equipped by Destroyer Cult models from your army.\nThe first time each turn that a DESTROYER CULT unit from your army makes attacks that destroy a unit or cause it to become Below Half-strength, after that unit has finished resolving its attacks, until the end of the turn, add 2 to the Strength characteristic of weapons equipped by friendly NECRONS models (excluding DESTROYER CULT, Monster and Titanic models)."}, {"id": "000009748", "detachment_id": "000000985", "detachment": "Starshatter Arsenal", "name": "Relentless Onslaught", "description_html": "Each time a <span class=\"kwb\">NECRONS<\/span> model (excluding Monster models) from your army makes an attack that targets a unit within range of one or more objective markers, add 1 to the Hit roll. In addition, ranged weapons equipped by Necrons Vehicle and Necrons Mounted models (excluding Titanic models) from your army have the [ASSAULT] ability.", "description_text": "Each time a NECRONS model (excluding Monster models) from your army makes an attack that targets a unit within range of one or more objective markers, add 1 to the Hit roll. In addition, ranged weapons equipped by Necrons Vehicle and Necrons Mounted models (excluding Titanic models) from your army have the [ASSAULT] ability."}], "link": "https://wahapedia.ru/wh40k10ed/factions/necrons/Anrakyr-The-Traveller"}, "000000559": {"id": "000000559", "name": "Canoptek Acanthrites", "faction": {"id": "NEC", "name": "Necrons"}, "source": {"name": "Necrons (Warhammer Legends)", "type": "Faction Pack", "edition": "0", "version": "", "errata_date": "01.01.0001 0:00:00"}, "role": "Other", "legends": true, "allied_from": null, "legend": "Canoptek Acanthrites are created for a single purpose: the destruction of those who have dared to claim the ancient empire of the Necrontyr. Acanthrites’ articulated bodies are armed with hyper-phased voidblades and high-powered thermal cutting beams, enabling them to carve through and dissemble solid matter as though it were not there.", "loadout": "<b>Every model is equipped with:<\/b> cutting beam; voidblade.", "transport": null, "virtual": false, "models": [{"name": "Canoptek Acanthrites", "M": "12\"", "T": "5", "Sv": "3+", "inv_sv": "-", "inv_sv_descr": null, "W": "2", "Ld": "8+", "OC": "2", "base_size": "40mm"}], "weapons": [{"name": "Cutting beam", "type": "Ranged", "range": "12", "A": "1", "BS_WS": "4", "S": "9", "AP": "-4", "D": "D6", "abilities": [{"keyword": "melta", "value": "2", "anti_target": null, "anti_threshold": null, "known": true, "raw": "melta 2"}]}, {"name": "Voidblade", "type": "Melee", "range": "Melee", "A": "3", "BS_WS": "4", "S": "5", "AP": "-2", "D": "1", "abilities": []}], "abilities": {"faction": [{"name": "Reanimation Protocols", "model": null, "parameter": null, "description_html": "If your Army Faction is <span class=\"kwb\">NECRONS<\/span>, at the end of your Command phase, each unit from your army with this ability that is on the battlefield activates its Reanimation Protocols and reanimates D3 wounds. Each time such a unit reanimates a wound:<br><ul><li>If that unit contains one or more models with fewer than their starting number of wounds remaining, select one of those models; that model regains one lost wound<\/li><li>If all models in that unit have their starting number of wounds, but that unit is not at its Starting Strength, one destroyed model is returned to that unit with one wound remaining.<\/li><\/ul>Once such a unit is at its Starting Strength and all of its models have their starting number of wounds, nothing further happens.<br><br><div class=\"redExample\"><b>Example:<\/b> A unit of Lokhust Destroyers (which have a Wounds characteristic of 3) activates its Reanimation Protocols. The unit had a Starting Strength of 3, but currently contains 2 models, and one of those models has lost 1 wound. A 3 is rolled to see how many wounds are reanimated. The first of these reanimated wounds restores the wounded Lokhust Destroyer back to 3 wounds. The second of these reanimated wounds returns the destroyed Lokhust Destroyer to the battlefield with 1 wound remaining. The third of these reanimated wounds restores one of the remaining lost wounds to the same Lokhust Destroyer that was just returned. The unit now contains 3 models, two of which have 3 wounds remaining and one of which has 2 wounds remaining.<\/div>", "description_text": "If your Army Faction is NECRONS, at the end of your Command phase, each unit from your army with this ability that is on the battlefield activates its Reanimation Protocols and reanimates D3 wounds. Each time such a unit reanimates a wound:\nIf that unit contains one or more models with fewer than their starting number of wounds remaining, select one of those models; that model regains one lost wound\nIf all models in that unit have their starting number of wounds, but that unit is not at its Starting Strength, one destroyed model is returned to that unit with one wound remaining.\nOnce such a unit is at its Starting Strength and all of its models have their starting number of wounds, nothing further happens.\n\nExample: A unit of Lokhust Destroyers (which have a Wounds characteristic of 3) activates its Reanimation Protocols. The unit had a Starting Strength of 3, but currently contains 2 models, and one of those models has lost 1 wound. A 3 is rolled to see how many wounds are reanimated. The first of these reanimated wounds restores the wounded Lokhust Destroyer back to 3 wounds. The second of these reanimated wounds returns the destroyed Lokhust Destroyer to the battlefield with 1 wound remaining. The third of these reanimated wounds restores one of the remaining lost wounds to the same Lokhust Destroyer that was just returned. The unit now contains 3 models, two of which have 3 wounds remaining and one of which has 2 wounds remaining."}], "core": [{"name": "Infiltrators", "model": null, "parameter": null, "description_html": "<div class=\"Corner33 abWrap BreakInsideAvoid\"><div class=\"abFlex\"><div class=\"abDiamondWrap\"><div class=\"abDiamond\"><div class=\"abIcon\"><\/div><\/div><\/div><div class=\"abLine\"><\/div><div class=\"abNameWrap\"><div class=\"abName\">INFILTRATORS<\/div><\/div><\/div><p style=\"padding-bottom:8px\" class=\"ShowFluff stratLegend2\">Many armies employ reconnaissance units who can sit concealed, waiting for the right moment to strike.<\/p>During deployment, if every model in a unit has this ability, then when you set it up, it can be set up anywhere on the battlefield that is more than 9\" horizontally away from the enemy deployment zone and all enemy models.<\/div>", "description_text": "INFILTRATORS\n\nMany armies employ reconnaissance units who can sit concealed, waiting for the right moment to strike.\nDuring deployment, if every model in a unit has this ability, then when you set it up, it can be set up anywhere on the battlefield that is more than 9\" horizontally away from the enemy deployment zone and all enemy models."}], "datasheet": [{"name": "Damaged Armour", "model": null, "parameter": null, "description_html": "In your Shooting phase, after this unit has shot, select one enemy unit hit by one or more of those attacks. Until the end of the phase, each time a friendly <span class=\"kwb\">NECRONS<\/span> model makes an attack that targets that unit, on a Critical Wound, improve the Armour Penetration characteristic of that attack by 1.", "description_text": "In your Shooting phase, after this unit has shot, select one enemy unit hit by one or more of those attacks. Until the end of the phase, each time a friendly NECRONS model makes an attack that targets that unit, on a Critical Wound, improve the Armour Penetration characteristic of that attack by 1."}]}, "keywords": ["Acanthrites", "Canoptek", "Fly", "Beasts"], "faction_keywords": ["Necrons"], "unit_composition": [{"line": "1", "description": "3-6 Canoptek Acanthrites"}], "wargear_options": [{"line": "1", "description": "None"}], "points": [{"description": "3 models", "cost": "85"}, {"description": "6 models", "cost": "170"}], "leaders": {"can_lead": [], "can_be_led_by": []}, "detachment_abilities": [{"id": "000008545", "detachment_id": "000000816", "detachment": "Canoptek Court", "name": "Power Matrix", "description_html": "Certain areas of the battlefield are considered to be within your army’s Power Matrix, as follows: <br><br><ul><li>Your deployment zone is always within your army’s Power Matrix. <\/li><li>At the start of any phase, if you control at least half of the objective markers within No Man’s Land, until the end of that phase, No Man’s Land is within your army’s Power Matrix. <\/li><li>At the start of any phase, if you control at least half of the objective markers within your opponent’s deployment zone, until the end of that phase, your opponent’s deployment zone is within your army’s Power Matrix. <\/li><\/ul>Each time a model in a CRYPTEK or CANOPTEK unit from your army makes an attack, re-roll a Hit roll of 1. If such a unit is wholly within your army’s Power Matrix, you can re-roll the Hit roll instead.", "description_text": "Certain a
